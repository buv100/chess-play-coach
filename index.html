<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Chess Coach</title>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>
  <link rel="stylesheet" href="style.css?v=16" />
  <meta name="theme-color" content="#312e2b" />
</head>
<body>
  <div id="homeScreen" class="home-screen">
    <div class="home-inner">
      <h1 class="home-title">Chess Coach</h1>
      <p class="home-sub">Train with legends — play or solve</p>
      <div class="mode-cards">
        <button id="modeCoach" type="button" class="mode-card">
          <span class="mode-icon" aria-hidden="true">♟</span>
          <strong>Play Coach</strong>
          <span class="mode-desc">Play a full game with a legendary coach. Move feedback, hints, and voice.</span>
        </button>
        <button id="modePuzzle" type="button" class="mode-card mode-card-accent">
          <span class="mode-icon" aria-hidden="true">🧩</span>
          <strong>Puzzles</strong>
          <span class="mode-desc">Find the best move in a set position. Coach, hints, and move ratings.</span>
        </button>
      </div>
    </div>
  </div>

  <div id="gameRoot" class="game-root hidden">
  <header class="coach-panel">
    <div class="coach-top">
      <div id="magnusAvatar" class="magnus-avatar">
        <img id="coachAvatar" class="magnus-photo" src="coaches/magnus.jpg" alt="Magnus Carlsen" />
      </div>
      <div class="coach-identity">
        <div class="coach-row">
          <strong id="coachBrand" class="brand">Magnus Carlsen</strong>
          <span id="playCoachLabel" class="play-coach-label">Play Coach</span>
        </div>
        <span id="coachStyle" class="coach-style-line">Simplify, squeeze, win endgames</span>
        <span id="coachTitle" class="badge idle">Coach</span>
      </div>
      <button id="voiceBtn" type="button" class="voice-toggle" aria-label="Mute coach voice">🔊</button>
    </div>
    <div id="coachPickerBar" class="coach-strip" aria-label="Choose your coach"></div>
    <div class="coach-speech">
      <p id="coachText">Alright. Let's play.</p>
      <p id="tipText" class="tip-line"></p>
    </div>
    <div class="coach-actions">
      <button id="installBtn" type="button" class="idea ghost-idea hidden">Install</button>
      <button id="ideaBtn" type="button" class="idea">Idea</button>
    </div>
  </header>

  <main class="play">
    <div id="evalCol" class="eval-col">
      <div id="evalFill" class="eval-fill"></div>
    </div>
    <div class="board-wrap">
      <div id="playerTop" class="player-bar top">
        <div class="player-info">
          <div class="avatar-wrap"><span class="avatar black"></span></div>
          <div class="player-meta">
            <span id="oppName" class="player-name">Coach</span>
            <span id="oppRating" class="player-rating">1000</span>
            <span id="puzzleMeta" class="player-rating puzzle-meta hidden"></span>
          </div>
        </div>
        <div id="clockTop" class="player-clock">∞</div>
      </div>
      <div class="board-frame">
        <div id="board" class="board"></div>
        <svg id="arrows" class="arrows" viewBox="0 0 8 8" preserveAspectRatio="none">
          <defs>
            <marker id="hintHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#eb9950"></path>
            </marker>
            <marker id="sugHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#96bc4b"></path>
            </marker>
            <marker id="threatHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#c23b22"></path>
            </marker>
          </defs>
          <g id="threatLayer"></g>
          <line id="sugArrow" class="sug hidden" x1="0" y1="0" x2="0" y2="0" marker-end="url(#sugHead)"></line>
          <line id="hintArrow" class="hint hidden" x1="0" y1="0" x2="0" y2="0" marker-end="url(#hintHead)"></line>
        </svg>
      </div>
      <div id="playerBottom" class="player-bar bottom active">
        <div class="player-info">
          <div class="avatar-wrap"><span class="avatar white"></span></div>
          <div class="player-meta">
            <span class="player-name">You</span>
          </div>
        </div>
        <div id="clockBottom" class="player-clock">∞</div>
      </div>
    </div>
  </main>

  <footer class="dock">
    <div id="levels" class="levels"></div>
    <div class="tools">
      <button id="hintBtn" type="button">Hint</button>
      <button id="undoBtn" type="button">Undo</button>
      <button id="homeBtn" type="button" class="ghost">Home</button>
      <button id="newGame" type="button" class="ghost">New Game</button>
      <button id="settingsBtn" type="button" class="ghost" aria-label="Settings">⚙</button>
    </div>
  </footer>

  <div id="settings" class="sheet hidden">
    <div class="sheet-card">
      <h3>Settings</h3>
      <p class="settings-label">Choose your coach</p>
      <div id="coachPicker" class="coach-picker"></div>
      <label><input id="optVoice" type="checkbox" checked /> Coach voice (speaks aloud)</label>
      <label><input id="optSuggest" type="checkbox" /> Suggestion arrows (Hint / Idea only)</label>
      <label><input id="optThreat" type="checkbox" checked /> Threat arrows</label>
      <label><input id="optEval" type="checkbox" checked /> Evaluation bar</label>
      <button id="closeSettings" type="button">Done</button>
    </div>
  </div>
  </div><!-- gameRoot -->

  <script>
    (function () {
      var base = location.pathname.indexOf("/chess-play-coach") === 0
        ? "/chess-play-coach/"
        : "./";
      var v = document.createElement("script");
      v.src = base + "voice.js?v=16";
      v.onload = function () {
        document.body.appendChild(s);
      };
      v.onerror = function () {
        document.body.appendChild(s);
      };
      document.body.appendChild(v);
      var s = document.createElement("script");
      s.src = base + "game.js?v=16";
      s.onerror = function () {
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<p style="padding:12px;background:#fa412d;color:#fff">Could not load game.js</p>'
        );
      };
    })();
  </script>
</body>
</html>
